<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Lab</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Arial,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:700px;
            background:white;
            border-radius:20px;
            padding:50px;
            box-shadow:0 15px 40px rgba(0,0,0,.2);
            text-align:center;
        }

        h1{
            color:#2c3e50;
            margin-bottom:15px;
        }

        h2{
            color:#3498db;
            margin-bottom:30px;
            font-size:22px;
        }

        p{
            font-size:18px;
            color:#555;
            line-height:1.7;
        }

        .success{
            margin-top:35px;
            background:#27ae60;
            color:white;
            padding:15px;
            border-radius:10px;
            font-weight:bold;
            font-size:18px;
        }

        footer{
            margin-top:35px;
            color:#777;
            font-size:15px;
        }

        .heart{
            color:red;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🚀 Cloud Computing Lab</h1>

    <h2>CI/CD Deployment using Jenkins + Docker</h2>

    <p>
        Xin chào thầy 👋
    </p>

    <br>

    <p>
        Website này được triển khai tự động bằng
        <b>GitHub → Jenkins → Docker → AWS EC2</b>.
    </p>

    <div class="success">
        ✅ Deployment Successful
    </div>

    <footer>
        Student: <b>Truc Quynh</b><br>
        HUFLIT - Cloud Computing Lab ❤️
    </footer>

</div>

</body>
</html>
